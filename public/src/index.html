<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Acervo Criativo</title>
    <link rel="stylesheet" href="/public/assets/css/style.css">
</head>
<body>

    <header class="topbar">
        <h1>Meu Acervo Criativo</h1>
        <!-- Botão de tema (dentro do cabeçalho para ficar na mesma linha) -->
        <button id="theme-toggle" aria-label="Alternar tema">
            <span class="icon-sun">☀︎</span>
            <span class="icon-moon" style="display: none;">☾</span>
        </button>
    </header>

    <nav class="menu">
        <a href="#ilustracoes">Ilustrações</a>
        <a href="#estante">Estante Virtual</a>
        <a href="#tcg">Coleções TCG</a>
        <a href="#games">Log de Games</a>
    </nav>

    <main>

        <section id="destaques">
            <h2>Em Destaque</h2>

            <div class="carrossel">
                <button class="carrossel-btn anterior" id="btn-anterior" aria-label="Anterior">‹</button>

                <div class="carrossel-viewport">
                    <div class="carrossel-trilha" id="carrossel-trilha">
                        <!-- Slides injetados via JS -->
                    </div>
                </div>

                <button class="carrossel-btn proximo" id="btn-proximo" aria-label="Próximo">›</button>

                <div class="carrossel-indicadores" id="carrossel-indicadores"></div>
            </div>
        </section>

        <section id="ilustracoes">
            <h2>Ultimas Ilustrações</h2>
            <!-- Container vazio onde o JS vai injetar os cards -->
            <div class="grade-ilustracoes" id="container-ilustracoes"></div>
        </section>

        <section id="estante">
            <h2>Estante Virtual</h2>
            <div class="estante">
                <article class="card-estante">
                    <h3>Lendo</h3>
                    <ul class="lista-livros" id="lista-lendo">
                        <!-- Os livros de "Lendo" serão inseridos aqui pelo JavaScript -->
                    </ul>
                </article>

                <article class="card-estante">
                    <h3>Lidos</h3>
                    <ul class="lista-livros" id="lista-lidos">
                        <!-- Os livros de "Lidos" serão inseridos aqui pelo JavaScript -->
                    </ul>
                </article>

                <article class="card-estante">
                    <h3>Quero Ler</h3>
                    <ul class="lista-livros" id="lista-quero-ler">
                        <!-- Os livros de "Quero Ler" serão inseridos aqui pelo JavaScript -->
                    </ul>
                </article>
            </div>
        </section>

        <section id="tcg">
            <h2>Coleções TCG</h2>
            <article class="card-tcg">
                <div class="imagem-tcg">
                    <img src="/public/assets/images/cardstcg.jpeg" alt="descrição da imagem">
                </div>
                <!-- Container vazio onde o JS vai injetar as barras de progresso -->
                <div id="container-barras-tcg"></div>
            </article>
        </section>

        <section id="games">
            <h2>Log de Games</h2>
            <!-- Container vazio onde o JS vai injetar os cards dos jogos -->
            <div class="log-games" id="container-jogos"></div>
        </section>

        <section id="login">
            <h2>Login</h2>
            <form class="form-login">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario">

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha">

                <button type="submit">Entrar</button>
            </form>
        </section>

    </main>

    <footer class="rodape">
        <p>Meu Acervo Criativo - trabalho de faculdade</p>
    </footer>

    <!-- Caminho original mantido -->
    <script src="/public/assets/js/index.js"></script>
</body>
</html>
